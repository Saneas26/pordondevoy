# Por dónde voy · compila la app Android (Capacitor) en la nube y deja el .aab (y un .apk) como artefacto.
# - Con los 4 secretos de firma (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) el .aab sale FIRMADO con la clave de subida (Play App Signing).
#   Se reutilizan los mismos 4 secretos que ya existen en el repo Saneas26/saneas-app.
# - Sin ellos compila igual, pero SIN FIRMAR (sirve para validar el pipeline; Play no lo acepta).
# Documentación: ANDROID.md en la raíz del repo.
name: Android (Capacitor)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'js/**'
      - 'planes/**'
      - 'herramientas/**'
      - 'img/**'
      - 'index.html'
      - 'manifest.json'
      - 'rutas.js'
      - 'sw.js'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/build-www.sh'
      - '.github/workflows/android.yml'
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    name: Compilar .aab / .apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: Construir www/ (copia del sitio, con sw.js para el audio offline)
        run: |
          set -euo pipefail
          npm run build:www
          test -f www/index.html
          test -f www/sw.js
      - name: Capacitor sync
        run: npx cap sync android
      - name: Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
      - name: Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4
      - name: Clave de subida (desde Secrets, si existen)
        id: firma
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            KS="$RUNNER_TEMP/upload-key.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
            test -s "$KS" || { echo "ERROR: el keystore decodificado está vacío (¿ANDROID_KEYSTORE_BASE64 mal copiado?)"; exit 1; }
            echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
            echo "firmado=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Firma::Keystore de subida cargado desde los Secrets. El .aab saldrá FIRMADO."
          else
            echo "firmado=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=SIN FIRMA::Faltan secretos (ANDROID_KEYSTORE_BASE64 / _PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD). El .aab se compila SIN FIRMAR: vale para validar el pipeline, NO para subir a Google Play."
          fi
      - name: Gradle bundleRelease + assembleRelease
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace bundleRelease assembleRelease
      - name: Verificar artefactos (hash, manifest, applicationId, firma)
        id: verificar
        shell: bash
        run: |
          set -euo pipefail
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n1)
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          test -s "$AAB" || { echo "ERROR: no hay .aab"; exit 1; }
          test -s "$APK" || { echo "ERROR: no hay .apk"; exit 1; }
          mkdir -p salida
          cp "$AAB" salida/pordondevoy-release.aab
          cp "$APK" salida/pordondevoy-release.apk
          echo "== SHA256 =="
          sha256sum salida/pordondevoy-release.aab salida/pordondevoy-release.apk | tee salida/SHA256SUMS.txt
          AAB_SHA=$(sha256sum salida/pordondevoy-release.aab | cut -d' ' -f1)
          echo "aab_sha256=$AAB_SHA" >> "$GITHUB_OUTPUT"
          echo "== Estructura del .aab =="
          unzip -l salida/pordondevoy-release.aab | grep -E 'base/manifest/AndroidManifest.xml|base/assets/public/index.html' || { echo "ERROR: el .aab no contiene el manifest o index.html"; exit 1; }
          unzip -l salida/pordondevoy-release.aab | grep -q 'base/assets/public/sw.js' || { echo "ERROR: sw.js no está dentro del .aab (hace falta para el audio offline)"; exit 1; }
          echo "== Manifest del .aab (bundletool) =="
          gh release download --repo google/bundletool --pattern 'bundletool-all-*.jar' --dir "$RUNNER_TEMP" --clobber
          BT=$(ls "$RUNNER_TEMP"/bundletool-all-*.jar | head -n1)
          java -jar "$BT" dump manifest --bundle=salida/pordondevoy-release.aab > salida/AndroidManifest.aab.xml
          grep -o 'package="[^"]*"' salida/AndroidManifest.aab.xml
          grep -o 'android:versionCode="[^"]*"' salida/AndroidManifest.aab.xml
          grep -o 'android:versionName="[^"]*"' salida/AndroidManifest.aab.xml
          grep -q 'package="es.saneas.pordondevoy"' salida/AndroidManifest.aab.xml || { echo "ERROR: applicationId != es.saneas.pordondevoy"; exit 1; }
          grep -q 'android:usesCleartextTraffic="false"' salida/AndroidManifest.aab.xml || { echo "ERROR: usesCleartextTraffic no es false"; exit 1; }
          VC=$(grep -o 'android:versionCode="[^"]*"' salida/AndroidManifest.aab.xml | head -n1 | cut -d'"' -f2)
          VN=$(grep -o 'android:versionName="[^"]*"' salida/AndroidManifest.aab.xml | head -n1 | cut -d'"' -f2)
          echo "== APK (aapt2 badging) =="
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          "$AAPT2" dump badging salida/pordondevoy-release.apk | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion|uses-permission" | tee salida/badging.txt
          grep -q "package: name='es.saneas.pordondevoy'" salida/badging.txt || { echo "ERROR: el APK no es es.saneas.pordondevoy"; exit 1; }
          echo "== Firma =="
          if [ "${{ steps.firma.outputs.firmado }}" = "true" ]; then
            jarsigner -verify -verbose:summary salida/pordondevoy-release.aab | tail -n 3
            jarsigner -verify salida/pordondevoy-release.aab | grep -q "jar verified" || { echo "ERROR: el .aab no está correctamente firmado"; exit 1; }
            echo "FIRMA=firmado con la clave de subida" >> salida/INFO.txt
          else
            echo "FIRMA=SIN FIRMAR (faltan los secretos)" >> salida/INFO.txt
          fi
          echo "VERSION=$VN ($VC)" >> salida/INFO.txt
          echo "COMMIT=${GITHUB_SHA}" >> salida/INFO.txt
          {
            echo "## Por dónde voy Android · build"
            echo "- **applicationId**: es.saneas.pordondevoy"
            echo "- **versionName/versionCode**: $VN / $VC"
            echo "- **Firma**: $([ "${{ steps.firma.outputs.firmado }}" = "true" ] && echo 'FIRMADO (clave de subida)' || echo 'SIN FIRMAR (faltan secretos)')"
            echo "- **SHA256 .aab**: \`$AAB_SHA\`"
            echo "- **Commit**: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Subir artefacto .aab
        uses: actions/upload-artifact@v4
        with:
          name: pordondevoy-android-aab
          path: |
            salida/pordondevoy-release.aab
            salida/SHA256SUMS.txt
            salida/INFO.txt
            salida/AndroidManifest.aab.xml
          if-no-files-found: error
          retention-days: 30
      - name: Subir artefacto .apk (prueba directa en un móvil o el emulador)
        uses: actions/upload-artifact@v4
        with:
          name: pordondevoy-android-apk
          path: |
            salida/pordondevoy-release.apk
            salida/badging.txt
          if-no-files-found: error
          retention-days: 30
